<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - Cozy Study Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <style>
        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        
        .history-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: all var(--transition-smooth);
        }
        
        .history-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(48, 32, 26, 0.15);
            border-color: rgba(199, 130, 72, 0.3);
        }
        
        .history-card-header {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }
        
        .history-icon {
            background: rgba(199, 130, 72, 0.1);
            color: var(--clr-caramel);
            padding: 0.75rem;
            border-radius: var(--radius-sm);
        }
        
        .history-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .history-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
    </style>
</head>
<body>
    <header class="app-header">
        <a href="/" class="logo">
            <span class="material-symbols-outlined logo-icon">local_cafe</span>
            Study Cafe
        </a>
        <button class="mobile-menu-btn" id="mobile-menu-btn">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <nav class="nav-links" id="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/solve" class="nav-link">Solve Questions</a>
            <a href="/practice" class="nav-link">Practice</a>
            <a href="/history" class="nav-link active">History</a>
            <div class="auth-buttons" id="auth-buttons">
                <!-- Injected via auth.js -->
            </div>
        </nav>
    </header>

    <main class="main-container">
        <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">Your Study Log</h1>
        <p class="text-muted" style="font-size: 1.1rem;">Pick up exactly where you left off.</p>
        
        <div id="loader-container" class="mt-4" style="text-align: center; display: none;">
            <div class="loader" style="margin: 0 auto; border-top-color: var(--clr-caramel);"></div>
        </div>
        
        <div class="history-grid" id="history-grid">
            <!-- Dynamically populated -->
        </div>
        
        <div id="empty-state" class="hidden" style="text-align: center; margin-top: 4rem;">
            <span class="material-symbols-outlined" style="font-size: 4rem; color: var(--clr-sage); margin-bottom: 1rem;">menu_book</span>
            <h2>Your study table is empty.</h2>
            <p class="text-muted mb-3">Upload a question paper to get started.</p>
            <a href="/" class="btn btn-primary">Go to Home</a>
        </div>
    </main>

    <div id="toast-container"></div>

    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!getToken()) {
                window.location.href = '/login';
                return;
            }
            
            const loader = document.getElementById('loader-container');
            const grid = document.getElementById('history-grid');
            const emptyState = document.getElementById('empty-state');
            
            loader.style.display = 'block';
            
            try {
                const res = await fetch('/api/docs/history', {
                    headers: getAuthHeaders()
                });
                const data = await res.json();
                
                loader.style.display = 'none';
                
                if (data.history && data.history.length > 0) {
                    data.history.forEach(item => {
                        const date = new Date(item.uploaded_at).toLocaleDateString('en-US', {
                            year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                        });
                        
                        const title = item.title || 'Untitled Document';
                        const status = item.analysis_status === 'completed' ? 'Ready' : 'Pending';
                        const statusColor = item.analysis_status === 'completed' ? 'var(--clr-sage)' : 'var(--clr-terracotta)';
                        
                        const card = document.createElement('div');
                        card.className = 'history-card';
                        card.innerHTML = `
                            <div class="history-card-header">
                                <div class="history-icon">
                                    <span class="material-symbols-outlined">description</span>
                                </div>
                                <div>
                                    <div class="history-title">${title}</div>
                                    <div class="history-meta mb-1">
                                        <span class="material-symbols-outlined" style="font-size:1rem;">calendar_today</span>
                                        ${date}
                                    </div>
                                    <div class="history-meta">
                                        <span class="material-symbols-outlined" style="font-size:1rem;">quiz</span>
                                        ${item.question_count} questions
                                    </div>
                                </div>
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:auto;">
                                <span style="font-size:0.85rem; font-weight:500; color:${statusColor};">${status}</span>
                                <a href="/solve?doc=${item.id}" class="btn btn-secondary" style="padding:0.5rem 1rem; font-size:0.9rem;">
                                    Continue
                                </a>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    emptyState.classList.remove('hidden');
                }
            } catch (err) {
                loader.style.display = 'none';
                showToast('Failed to load history', true);
            }
        });
    </script>
</body>
</html>
