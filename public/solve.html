<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solve - Cozy Study Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <style>
        .solve-container {
            display: flex;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
            height: calc(100vh - 80px); /* subtract header height roughly */
        }
        
        .document-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--clr-cream);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }
        
        .document-viewer {
            flex: 1;
            width: 100%;
            border: none;
            object-fit: contain;
            background: #e9e9e9;
        }
        
        .interaction-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
            padding-right: 0.5rem; /* for scrollbar */
        }
        
        .question-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            padding: 2rem;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(92, 67, 59, 0.1);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .question-nav {
            display: flex;
            gap: 0.5rem;
        }
        
        .question-nav button {
            background: rgba(92, 67, 59, 0.1);
            border: none;
            border-radius: var(--radius-sm);
            padding: 0.5rem;
            cursor: pointer;
            color: var(--clr-espresso);
            transition: all var(--transition-fast);
        }
        
        .question-nav button:hover {
            background: rgba(92, 67, 59, 0.2);
        }
        
        .step-list {
            list-style: none;
            margin: 1.5rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .step-item {
            background: var(--clr-cream);
            padding: 1rem 1.5rem;
            border-radius: var(--radius-md);
            border-left: 4px solid var(--clr-sage);
            font-size: 1rem;
            line-height: 1.5;
        }
        
        .answer-box {
            background: rgba(208, 140, 112, 0.15); /* Terracotta tint */
            padding: 1.5rem;
            border-radius: var(--radius-md);
            margin-top: 1.5rem;
            font-weight: 500;
        }
        
        .chat-section {
            display: flex;
            flex-direction: column;
            flex: 1;
            background: var(--glass-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            overflow: hidden;
            min-height: 400px;
        }
        
        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .chat-msg {
            max-width: 80%;
            padding: 1rem 1.25rem;
            border-radius: var(--radius-md);
            line-height: 1.4;
        }
        
        .msg-user {
            align-self: flex-end;
            background: var(--clr-coffee);
            color: var(--clr-cream);
            border-bottom-right-radius: 4px;
        }
        
        .msg-bot {
            align-self: flex-start;
            background: var(--clr-cream);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(92, 67, 59, 0.1);
        }
        
        .chat-input {
            display: flex;
            padding: 1rem;
            background: var(--clr-cream);
            border-top: 1px solid rgba(92, 67, 59, 0.1);
            gap: 0.5rem;
        }
        
        .chat-input input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid rgba(92, 67, 59, 0.2);
            border-radius: var(--radius-full);
            outline: none;
            font-family: var(--font-body);
        }
        
        .chat-input input:focus {
            border-color: var(--clr-caramel);
        }
        
        .chat-input button {
            background: var(--clr-caramel);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .chat-input button:hover {
            background: var(--clr-terracotta);
            transform: scale(1.05);
        }
        
        @media (max-width: 992px) {
            .solve-container {
                flex-direction: column;
                height: auto;
            }
            .document-panel {
                height: 400px;
                flex: none;
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <a href="/" class="logo">
            <span class="material-symbols-outlined logo-icon">local_cafe</span>
            Study Cafe
        </a>
        <button class="mobile-menu-btn" id="mobile-menu-btn">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <nav class="nav-links" id="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/solve" class="nav-link active">Solve Questions</a>
            <a href="/practice" class="nav-link">Practice</a>
            <a href="/history" class="nav-link">History</a>
            <div class="auth-buttons" id="auth-buttons">
                <!-- Injected via auth.js -->
            </div>
        </nav>
    </header>

    <div class="solve-container">
        <!-- Left: Document Viewer -->
        <div class="document-panel">
            <h3 style="padding: 1rem 1.5rem; border-bottom: 1px solid rgba(0,0,0,0.1);" id="doc-title">Loading document...</h3>
            <div id="viewer-container" style="flex:1; display:flex;">
                <!-- Iframe or Img injected here -->
            </div>
        </div>
        
        <!-- Right: Interaction Panel -->
        <div class="interaction-panel">
            <div class="question-card" id="question-card">
                <div class="question-header">
                    <h2 id="q-number">Question -</h2>
                    <div class="question-nav">
                        <button id="btn-prev" title="Previous Question"><span class="material-symbols-outlined">chevron_left</span></button>
                        <span id="q-counter" style="display:flex; align-items:center; font-weight:600;">0/0</span>
                        <button id="btn-next" title="Next Question"><span class="material-symbols-outlined">chevron_right</span></button>
                    </div>
                </div>
                
                <h3 id="q-text" class="mb-4" style="line-height: 1.4;">Loading question...</h3>
                
                <div id="q-steps-container">
                    <h4 style="color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Step-by-step Guide</h4>
                    <ul class="step-list" id="q-steps">
                        <li class="step-item">Brewing steps...</li>
                    </ul>
                </div>
                
                <div class="answer-box hidden" id="q-answer-box">
                    <h4 style="color: var(--clr-espresso); margin-bottom: 0.5rem;">Answer</h4>
                    <p id="q-answer"></p>
                </div>
            </div>
            
            <div class="chat-section">
                <div style="padding: 1rem 1.5rem; border-bottom: 1px solid rgba(92, 67, 59, 0.1); background: var(--clr-cream);">
                    <h3 style="font-size: 1.1rem; display: flex; align-items: center; gap: 0.5rem;">
                        <span class="material-symbols-outlined" style="color: var(--clr-caramel)">forum</span>
                        Ask Gemini
                    </h3>
                </div>
                
                <div class="chat-messages" id="chat-messages">
                    <div class="chat-msg msg-bot">
                        Hi! I'm here to help. Ask me to explain a step, check your work, or give you a hint.
                    </div>
                </div>
                
                <form class="chat-input" id="chat-form">
                    <input type="text" id="chat-input-text" placeholder="Type your question..." autocomplete="off">
                    <button type="submit" id="chat-send-btn">
                        <span class="material-symbols-outlined">send</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/solve.js"></script>
</body>
</html>
