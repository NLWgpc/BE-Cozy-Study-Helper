<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Cozy Study Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 85vh;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .auth-header {
            margin-bottom: 2.5rem;
        }
        .auth-header .logo-icon {
            font-size: 4rem;
            margin-bottom: 0.75rem;
            color: var(--clr-caramel);
        }
        .auth-header h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        .auth-header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.5;
        }
        .google-btn-wrapper {
            display: flex;
            justify-content: center;
            min-height: 50px;
            margin-top: 0.5rem;
        }
        .google-signin-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.85rem 1.25rem;
            border: 2px solid rgba(92, 67, 59, 0.15);
            border-radius: var(--radius-sm);
            background: #fff;
            color: #3c4043;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-smooth);
        }
        .google-signin-btn:hover {
            border-color: rgba(66, 133, 244, 0.4);
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.15);
            transform: translateY(-1px);
        }
        .google-signin-btn svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }
        .auth-footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(250, 247, 240, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 1.5rem;
        }
        .loading-overlay.active {
            display: flex;
        }
        .loading-overlay .loader {
            width: 48px;
            height: 48px;
            border-width: 4px;
            border-top-color: var(--clr-caramel);
        }
        .loading-overlay p {
            font-size: 1.1rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header class="app-header">
        <a href="/" class="logo">
            <span class="material-symbols-outlined logo-icon">local_cafe</span>
            Study Cafe
        </a>
    </header>

    <!-- Loading overlay shown during Google auth -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loader"></div>
        <p>Signing you in...</p>
    </div>

    <main class="main-container auth-container">
        <div class="auth-card glass-panel">
            <div class="auth-header">
                <span class="material-symbols-outlined logo-icon">local_cafe</span>
                <h2>Welcome to Study Cafe</h2>
                <p>Sign in with your Google account to start turning question papers into study sessions.</p>
            </div>

            <div class="google-btn-wrapper" id="google-signin-container">
                <button class="google-signin-btn" id="google-fallback-btn">
                    <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    Continue with Google
                </button>
            </div>

            <div class="auth-footer">
                By signing in, you agree to use this app for educational purposes.<br>
                Your documents and study data are stored securely.
            </div>
        </div>
    </main>

    <div id="toast-container"></div>

    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        // If already logged in, redirect immediately
        document.addEventListener('DOMContentLoaded', () => {
            if (getToken()) {
                window.location.href = '/';
                return;
            }
            initGoogleSignIn();
        });

        async function handleGoogleCredentialResponse(response) {
            const overlay = document.getElementById('loading-overlay');
            overlay.classList.add('active');

            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Google Sign-In failed');

                setToken(data.access_token);
                window.location.href = '/';
            } catch (err) {
                overlay.classList.remove('active');
                showToast(err.message, true);
            }
        }

        async function initGoogleSignIn() {
            try {
                const res = await fetch('/api/config/google-client-id');
                const data = await res.json();
                const clientId = data.client_id;

                if (!clientId) {
                    showToast('Google Sign-In is not configured. Please set GOOGLE_CLIENT_ID.', true);
                    return;
                }

                function tryInit() {
                    if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
                        google.accounts.id.initialize({
                            client_id: clientId,
                            callback: handleGoogleCredentialResponse
                        });

                        const container = document.getElementById('google-signin-container');
                        container.innerHTML = '';
                        google.accounts.id.renderButton(container, {
                            theme: 'outline',
                            size: 'large',
                            width: 380,
                            text: 'continue_with',
                            shape: 'rectangular',
                            logo_alignment: 'left'
                        });
                    } else {
                        setTimeout(tryInit, 200);
                    }
                }
                tryInit();
            } catch (err) {
                console.error('Failed to init Google Sign-In:', err);
                showToast('Could not load Google Sign-In. Please refresh.', true);
            }
        }
    </script>
</body>
</html>
